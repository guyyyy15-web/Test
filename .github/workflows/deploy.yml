name: Deploy to GitHub Pages

on:
  push:
    # The github-pages environment carries a deployment-branch rule created
    # when Pages published from this branch directly, and it rejects anything
    # else. Deploying from the branch the rule already allows avoids needing
    # that rule changed. If it is ever widened to "All branches", move this
    # back to `main`.
    #
    # The kalimba branch is listed so its builds reach the phone for testing;
    # the github-pages environment must allow it too (Settings → Environments).
    branches: [claude/setup-project-infrastructure-qYvTS, claude/kalimba-coach-app-md4eid]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            kalimba/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Kalimba Coach: its own package, published at /Test/kalimba/.
      - run: npm ci
        working-directory: kalimba
      - run: npm test
        working-directory: kalimba
      - run: npm run build
        working-directory: kalimba
      - run: cp -r kalimba/dist dist/kalimba
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
