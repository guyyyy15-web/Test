<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0b1e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Kalimba Coach</title>
  </head>
  <body>
    <main id="app">
      <header class="brand">
        <h1>Kalimba <span>Coach</span></h1>
        <p class="phase">שלב 0 · בדיקת מיקרופון</p>
      </header>

      <section id="start-screen" class="card center">
        <p>נגן על הקלימבה וראה אם הטלפון שומע אותך.</p>
        <button id="start" class="big-btn">🎤 התחל</button>
        <p class="hint">בלחיצה תתבקש לאשר גישה למיקרופון.</p>
      </section>

      <section id="error" class="card error" hidden></section>

      <section id="live" hidden>
        <div class="card readout">
          <div class="tine-big" id="tine-big">–</div>
          <div class="hz"><span id="hz">–</span> <small>Hz</small></div>
          <div class="cents-row">
            <span id="note-name">–</span>
            <span id="cents" class="cents">–</span>
          </div>
        </div>

        <div class="card">
          <div class="meter-label"><span>עוצמה</span><span id="db">–</span></div>
          <div class="meter" dir="ltr"><div id="meter-fill"></div><div id="meter-gate"></div></div>
          <div class="meter-label"><span>ביטחון</span><span id="conf">–</span></div>
          <div class="meter" dir="ltr"><div id="conf-fill"></div></div>
        </div>

        <div class="card">
          <div id="tines" class="tines" dir="ltr"></div>
          <canvas id="trace" dir="ltr"></canvas>
        </div>

        <details class="card debug">
          <summary>פרטים טכניים</summary>
          <pre id="debug" dir="ltr"></pre>
        </details>
      </section>

      <div id="resume" class="overlay" hidden>
        <button class="big-btn">▶ המשך להאזין</button>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
