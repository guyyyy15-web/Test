<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0b1e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kalimba" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icons/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Kalimba Coach</title>
  </head>
  <body>
    <main id="app">
      <header class="topbar">
        <a href="#/" id="back" class="back" hidden aria-label="חזרה">→</a>
        <h1 class="brand"><a href="#/">Kalimba <span>Coach</span></a></h1>
        <span id="screen-title" class="screen-title"></span>
      </header>
      <div id="screen"></div>
    </main>

    <div id="gate" class="overlay" hidden>
      <div class="card center gate-card">
        <p>כדי לשמוע אותך ולנגן צלילים, צריך הקשה אחת.</p>
        <button id="gate-btn" class="big-btn">🎤 התחל</button>
        <p class="hint">בפעם הראשונה תתבקש לאשר גישה למיקרופון.</p>
      </div>
    </div>
    <div id="mic-error" class="overlay" hidden>
      <div class="card error">
        <div id="mic-error-text"></div>
        <button id="mic-error-ok" class="chip-btn primary">הבנתי</button>
      </div>
    </div>
    <div id="toast" class="toast" role="status" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
